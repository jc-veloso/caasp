<svg width="680" height="430" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arquitetura de distribuição paralela via StartJob</title>
<desc>Schedule dispara o Job pai, que consulta 1000 notas pendentes, divide em 5 lotes de 200 e dispara 5 threads via StartJob. O Job pai finaliza sem esperar as threads. Cada thread reivindica sua nota (status P para F), processa, e grava o resultado final (S ou E).</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="430" fill="#ffffff"/>

<g>
<rect x="240" y="40" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Schedule Protheus</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Dispara o Job pai</text>
</g>

<line x1="340" y1="96" x2="340" y2="122" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="240" y="124" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="144" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Job pai</text>
<text x="340" y="162" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Busca 1000 pendentes</text>
</g>

<line x1="340" y1="180" x2="340" y2="206" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="240" y="208" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="228" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Distribui</text>
<text x="340" y="246" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">5 lotes de 200 notas</text>
</g>

<line x1="440" y1="236" x2="478" y2="236" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="480" y="208" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="560" y="228" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Pai finaliza</text>
<text x="560" y="246" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Não espera</text>
</g>

<path d="M340 264 L340 292" fill="none" stroke="#888780" stroke-width="0.5"/>
<path d="M97 292 L585 292" fill="none" stroke="#888780" stroke-width="0.5"/>
<line x1="97" y1="292" x2="97" y2="308" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="219" y1="292" x2="219" y2="308" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="341" y1="292" x2="341" y2="308" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="463" y1="292" x2="463" y2="308" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="585" y1="292" x2="585" y2="308" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="44" y="310" width="106" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="97" y="332" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Thread 1</text>
</g>
<g>
<rect x="166" y="310" width="106" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="219" y="332" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Thread 2</text>
</g>
<g>
<rect x="288" y="310" width="106" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="341" y="332" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Thread 3</text>
</g>
<g>
<rect x="410" y="310" width="106" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="463" y="332" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Thread 4</text>
</g>
<g>
<rect x="532" y="310" width="106" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="585" y="332" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Thread 5</text>
</g>

<text x="340" y="388" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Em cada thread: reivindica (P → F) → processa → grava (S/E)</text>
<text x="340" y="408" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Roxo: orquestração · Verde-azulado: threads paralelas</text>
</svg>
